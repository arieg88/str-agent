# All tunable assumptions live here, not in code.

[paths]
database = "data/stragent.duckdb"
raw_dir = "data/raw"
cache_dir = "data/cache"
output_dir = "outputs"

[cities.thessaloniki]
display_name = "Thessaloniki"
country_code = "gr"
# Copy the exact path from https://insideairbnb.com/get-the-data/ (right-click a Thessaloniki
# file link). {snapshot} is replaced by the snapshot date, e.g. 2026-09-25.
base_url = "https://data.insideairbnb.com/greece/central-macedonia/thessaloniki/{snapshot}"
currency = "EUR"
# Rough bounding box used to bias geocoding: west, south, east, north
viewbox = [22.85, 40.55, 23.05, 40.70]

[comps]
default_room_type = "Entire home/apt"
# Auto radius: try each step until min_comps are found. A radius chosen by the user (--radius)
# is used as-is, between min_radius_m and max_radius_m.
radius_steps_m = [500, 1000, 1500]
min_radius_m = 100
max_radius_m = 5000
min_comps = 10
bedroom_tolerance = 1
# Ignore obviously broken prices (local currency per night)
min_price = 10
max_price = 2000

[occupancy]
# Review-based model as described on Inside Airbnb's "Data Assumptions" page.
# Share of stays that leave a review.
review_rate = 0.5
# Assumed average stay in nights; a listing's minimum_nights is used instead when higher.
average_stay_nights = 3.0
# Occupancy is capped to avoid unrealistic estimates.
max_occupancy = 0.70

[market]
# A host with at least this many listings counts as a multi-listing ("professional") host.
multi_listing_threshold = 2

[geocoding]
user_agent = "stragent/0.1 (portfolio project)"
min_interval_seconds = 1.1

[llm]
# The memo writer (Stage 3). One provider class per API style:
#   "anthropic"          Claude, through the anthropic SDK
#   "openai_compatible"  OpenAI, or any server with an OpenAI-style API (Ollama, vLLM, hosted
#                        open models): set base_url, and api_key_env (empty for a local server)
# See README, "Switching the memo provider", for one block per provider.
provider = "anthropic"
model = "claude-sonnet-5-5"
base_url = ""
api_key_env = "ANTHROPIC_API_KEY"
# Seconds. timeout caps one HTTP attempt; deadline caps the whole memo (SDK retries and the one
# regeneration included). A regeneration is not started with less than min_attempt left.
timeout_seconds = 60
max_retries = 1
deadline_seconds = 120
min_attempt_seconds = 15
max_output_tokens = 8000
# Anthropic only: low | medium | high | xhigh | max. Current Claude models take no temperature.
effort = "medium"
prompt_version = "v1"

# Estimated cost per memo, USD per million tokens. A model with no entry is logged with cost
# null, never a guess. Source: Anthropic's published first-party API prices for these models,
# as listed in Anthropic's model table dated 2026-10-06 (platform.claude.com, "Pricing").
# Re-check there before relying on the numbers.
[llm.prices."claude-sonnet-5-5"]
input = 2.00
output = 10.00

[llm.prices."claude-haiku-5-5"]
input = 0.10
output = 0.50

[llm.prices."claude-opus-5-5"]
input = 4.00
output = 20.00
