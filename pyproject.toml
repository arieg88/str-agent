[project]
name = "stragent"
version = "0.1.0"
description = "Short-term-rental analyst for Thessaloniki, built on Inside Airbnb data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.7",
    "shapely>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.14.0",
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
# Installed by `uv sync` and kept by `uv run` automatically.
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "pre-commit>=3.7",
]

[project.scripts]
stragent = "stragent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stragent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: builds a fixture database (slower)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Greek review text and typographic symbols (€, –, ×) are intentional.
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
