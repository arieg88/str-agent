<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stragent · Thessaloniki STR analyst</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f3f0;
    --surface-1: #fcfcfb;
    --border: #e2e0da;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #77756f;
    --series-1: #2a78d6;
    --accent: #eb6834;
    --warn-bg: #fff4d6;
    --warn-ink: #6b4e00;
    --grid: #ecebe7;
    /* ordinal blue ramp for price quartiles (lightest step still clears 2:1 on light) */
    --q1: #86b6ef; --q2: #3987e5; --q3: #1c5cab; --q4: #0d366b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --border: #33322f;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #9a998f;
      --series-1: #3987e5;
      --accent: #d95926;
      --warn-bg: #3a2f10;
      --warn-ink: #f3d78a;
      --grid: #2a2a28;
      /* on dark, higher price = brighter; lightest-to-surface step stays >= 600 */
      --q1: #184f95; --q2: #2a78d6; --q3: #6da7ec; --q4: #cde2fb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-0); color: var(--text-primary);
  }
  .layout { display: grid; grid-template-columns: minmax(340px, 440px) 1fr; height: 100vh; }
  aside { overflow-y: auto; padding: 16px; border-right: 1px solid var(--border); }
  #map { height: 100%; min-height: 360px; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    #map { height: 55vh; order: -1; }
    aside { border-right: 0; }
  }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--text-secondary); margin: 0 0 14px; font-size: 13px; }
  form { display: grid; gap: 8px; background: var(--surface-1); border: 1px solid var(--border);
         border-radius: 10px; padding: 12px; }
  label { display: grid; gap: 3px; font-size: 12px; color: var(--text-secondary); }
  input, select { font: inherit; padding: 7px 8px; border: 1px solid var(--border);
                  border-radius: 6px; background: var(--surface-0); color: var(--text-primary); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  details.filters summary { cursor: pointer; font-size: 12px; color: var(--text-secondary); }
  details.filters[open] { display: grid; gap: 8px; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-primary); }
  button { font: inherit; font-weight: 600; padding: 9px; border: 0; border-radius: 6px;
           background: var(--series-1); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
          padding: 12px; margin-top: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; }
  .muted { color: var(--text-muted); font-size: 12px; }
  .error { color: #b3261e; margin-top: 10px; }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px;
          padding: 6px 8px; margin-top: 6px; font-size: 12px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--text-secondary); }
  .kpi .r { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--text-secondary); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 4px; text-align: right; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; }
  tr.comp { cursor: pointer; } tr.comp:hover { background: var(--surface-0); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .axis { fill: var(--text-muted); font-size: 10px; }
  .tip { position: absolute; pointer-events: none; background: var(--text-primary); color: var(--surface-1);
         font-size: 12px; padding: 4px 7px; border-radius: 5px; white-space: nowrap; transform: translate(-50%, -110%); }
  .tip b { font-weight: 650; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .hidden { display: none; }
  .leaflet-popup-content { font: 13px/1.4 system-ui, sans-serif; }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Should I Airbnb this flat?</h1>
    <p class="sub">Thessaloniki · Inside Airbnb data · estimates, not bookings</p>

    <form id="f">
      <label>Address or "lat, lon" (or click the map)
        <input id="address" required placeholder="Egnatia 120" autocomplete="off">
      </label>
      <div class="row">
        <label>Bedrooms
          <select id="bedrooms">
            <option value="">Any</option><option>0</option><option>1</option>
            <option selected>2</option><option>3</option><option>4</option><option>5</option>
          </select>
        </label>
        <label>Snapshot
          <select id="snapshot"><option value="">Latest</option></select>
        </label>
      </div>
      <details class="filters">
        <summary>Comp filters</summary>
        <div class="row">
          <label>Min reviews (12 m)<input id="min_reviews" type="number" min="0" value="0"></label>
          <label>Min rating<input id="min_rating" type="number" min="0" max="5" step="0.1" placeholder="any"></label>
        </div>
        <div class="row">
          <label>Max minimum stay<input id="max_min_nights" type="number" min="1" placeholder="any"></label>
          <label>Comps to list<input id="show" type="number" min="1" max="200" value="15"></label>
        </div>
        <label class="check"><input id="superhost_only" type="checkbox"> Superhosts only</label>
      </details>
      <button id="go" type="submit">Analyse</button>
    </form>
    <div id="err" class="error hidden" role="alert"></div>
    <div id="results" class="hidden">
      <div class="card" id="summary"></div>
      <div class="card" id="season"></div>
      <div class="card" id="market"></div>
      <div class="card" id="comps"></div>
    </div>
    <p class="muted" style="margin-top:14px">Data: <a href="https://insideairbnb.com">Inside Airbnb</a>, CC BY 4.0 ·
      <a href="/docs">API docs</a></p>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const eur = (v) => v == null ? "–" : "€" + Math.round(v).toLocaleString("en");
const pct = (v) => v == null ? "–" : Math.round(v * 100) + "%";
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* Build DOM with textContent only: values come from data and are never parsed as HTML. */
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}

/* ---------- map ---------- */
const map = L.map("map", { zoomControl: true }).setView([40.6326, 22.9416], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors · listings: Inside Airbnb",
}).addTo(map);
const layers = { hoods: null, pin: null, circle: null, comps: L.layerGroup().addTo(map) };
const markersById = new Map();

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

async function loadMeta() {
  try {
    const snaps = await api("/api/snapshots");
    for (const s of snaps) $("snapshot").append(el("option", { value: s.snapshot_date, text: s.snapshot_date }));
    const geo = await api("/api/neighbourhoods.geojson");
    layers.hoods = L.geoJSON(geo, {
      style: { color: css("--text-muted"), weight: 1, fillOpacity: 0.03 },
      onEachFeature: (f, layer) => layer.bindTooltip(f.properties.name, { sticky: true }),
    }).addTo(map);
    if (geo.features.length) map.fitBounds(layers.hoods.getBounds(), { padding: [10, 10] });
  } catch (e) { showError("No data loaded yet: run `stragent ingest` first. (" + e.message + ")"); }
}

map.on("click", (e) => {
  $("address").value = e.latlng.lat.toFixed(5) + ", " + e.latlng.lng.toFixed(5);
  $("f").requestSubmit();
});

/* ---------- request ---------- */
function filters() {
  const p = {};
  const num = (id) => $(id).value === "" ? null : Number($(id).value);
  if ($("bedrooms").value !== "") p.bedrooms = Number($("bedrooms").value);
  if ($("snapshot").value) p.snapshot = $("snapshot").value;
  p.min_reviews = num("min_reviews") || 0;
  if (num("min_rating") != null) p.min_rating = num("min_rating");
  if (num("max_min_nights") != null) p.max_min_nights = num("max_min_nights");
  if ($("superhost_only").checked) p.superhost_only = true;
  return p;
}
function locationOf(text) {
  const m = text.trim().match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  return m ? { lat: Number(m[1]), lon: Number(m[2]) } : { address: text.trim() };
}
function showError(msg) { $("err").textContent = msg; $("err").classList.remove("hidden"); }

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("err").classList.add("hidden");
  $("go").disabled = true; $("go").textContent = "Analysing…";
  try {
    const f = filters();
    const show = Number($("show").value) || 15;
    const analysis = await api("/api/analyze", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...locationOf($("address").value), ...f, show }),
    });
    // Same comps again, by coordinates (no second geocode): all of them for the map + seasonality.
    const qs = new URLSearchParams({ lat: analysis.location.latitude, lon: analysis.location.longitude });
    for (const [k, v] of Object.entries(f)) qs.set(k, v);
    const [comps, season] = await Promise.all([api("/api/comps?" + qs), api("/api/seasonality?" + qs)]);
    render(analysis, comps, season);
  } catch (e) { showError(e.message); }
  finally { $("go").disabled = false; $("go").textContent = "Analyse"; }
});

/* ---------- rendering ---------- */
function quartiles(values) {
  const s = [...values].sort((a, b) => a - b);
  const q = (p) => s[Math.min(s.length - 1, Math.floor(p * (s.length - 1)))];
  return [q(0.25), q(0.5), q(0.75)];
}

function render(a, all, season) {
  $("results").classList.remove("hidden");
  const loc = a.location;
  if (layers.pin) map.removeLayer(layers.pin);
  if (layers.circle) map.removeLayer(layers.circle);
  layers.circle = L.circle([loc.latitude, loc.longitude], {
    radius: a.filters.radius_m, color: css("--text-secondary"), weight: 1, dashArray: "4 4", fill: false,
  }).addTo(map);
  layers.pin = L.circleMarker([loc.latitude, loc.longitude], {
    radius: 9, color: css("--surface-1"), weight: 3, fillColor: css("--accent"), fillOpacity: 1,
  }).addTo(map).bindTooltip("Your flat", { direction: "top" });
  map.fitBounds(layers.circle.getBounds(), { padding: [20, 20] });

  // comps coloured by price quartile (ordinal blue ramp), 2px surface ring
  layers.comps.clearLayers(); markersById.clear();
  const prices = all.comps.map((c) => c.price);
  const cuts = prices.length ? quartiles(prices) : [0, 0, 0];
  const qColor = (p) => css(p <= cuts[0] ? "--q1" : p <= cuts[1] ? "--q2" : p <= cuts[2] ? "--q3" : "--q4");
  for (const c of all.comps) {
    const m = L.circleMarker([c.latitude, c.longitude], {
      radius: 6, color: css("--surface-1"), weight: 2, fillColor: qColor(c.price), fillOpacity: 1,
    });
    const box = el("div", {},
      el("b", { text: eur(c.price) + " / night" }), el("br"),
      `${c.bedrooms ?? "?"} bd · ${c.number_of_reviews_ltm ?? 0} reviews (12 m) · rating ${c.review_scores_rating ?? "–"}`, el("br"),
      `Est. revenue ${eur(c.est_revenue)} · active since ${c.active_since ? c.active_since.slice(0, 7) : "–"}`, el("br"),
      el("a", { href: c.url, target: "_blank", rel: "noopener", text: "Open on Airbnb" }));
    m.bindPopup(box);
    m.addTo(layers.comps); markersById.set(c.id, m);
  }

  renderSummary(a, cuts);
  renderSeason(season);
  renderMarket(a.market);
  renderComps(a);
}

function kpi(label, range, fmt) {
  return el("div", { class: "kpi" },
    el("div", { class: "v", text: range ? fmt(range.median) : "–" }),
    el("div", { class: "l", text: label }),
    el("div", { class: "r", text: range ? `${fmt(range.p25)} – ${fmt(range.p75)}` : "" }));
}

function renderSummary(a, cuts) {
  const box = $("summary"); box.replaceChildren();
  const f = a.filters, loc = a.location;
  box.append(el("h2", { text: loc.neighbourhood || "Selected location" }));
  box.append(el("div", { class: "muted",
    text: `${a.comp_stats.count} comps · ${f.room_type} · bedrooms ${f.bedrooms ?? "any"}${f.bedrooms != null ? " ±" + f.bedroom_tolerance : ""} · within ${f.radius_m} m · snapshot ${a.snapshot_date}` }));
  for (const w of a.warnings) box.append(el("div", { class: "warn", text: w }));
  const grid = el("div", { class: "kpis", style: "margin-top:10px" },
    kpi("Nightly price", a.comp_stats.nightly_price, eur),
    kpi("Revenue / year", a.revenue.annual_revenue, eur),
    kpi("Occupancy", a.revenue.occupancy, pct),
    kpi("Nights / year", a.revenue.occupied_nights, (v) => Math.round(v)));
  box.append(grid);
  box.append(el("div", { class: "muted", style: "margin-top:8px",
    text: "Median with 25th–75th percentile across comps with recent reviews. Occupancy is inferred from reviews (review rate " +
      pct(a.revenue.assumptions.review_rate) + ", cap " + pct(a.revenue.assumptions.max_occupancy) + ")." }));
  const legend = el("div", { class: "legend" }, el("span", {}, el("i", { style: "background:" + css("--accent") }), "Your flat"));
  const labels = [`≤ ${eur(cuts[0])}`, `≤ ${eur(cuts[1])}`, `≤ ${eur(cuts[2])}`, `> ${eur(cuts[2])}`];
  ["--q1", "--q2", "--q3", "--q4"].forEach((v, i) =>
    legend.append(el("span", {}, el("i", { style: "background:" + css(v) }), labels[i])));
  box.append(el("div", { class: "muted", style: "margin-top:8px", text: "Map: comps by nightly price" }), legend);
}

/* Single-series bar chart, hover tooltip per bar, with a table view behind <details>. */
function barChart(title, rows, valueFmt, tickEvery = 1) {
  const W = 400, H = 150, padL = 4, padB = 18, padT = 14;
  const n = rows.length, max = Math.max(...rows.map((r) => r.value), 0) || 1;
  const slot = (W - padL) / Math.max(n, 1), bw = Math.max(2, slot - 2);   // 2px gap between bars
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", title);
  const wrap = el("div", { class: "chart" });
  const tip = el("div", { class: "tip hidden" });
  const base = H - padB;
  const line = document.createElementNS(NS, "line");
  Object.entries({ x1: 0, x2: W, y1: base, y2: base, stroke: css("--grid") }).forEach(([k, v]) => line.setAttribute(k, v));
  svg.append(line);
  const top = document.createElementNS(NS, "line");   // recessive gridline at the max, labelled
  Object.entries({ x1: 0, x2: W, y1: padT, y2: padT, stroke: css("--grid"), "stroke-dasharray": "2 3" }).forEach(([k, v]) => top.setAttribute(k, v));
  const topLabel = document.createElementNS(NS, "text");
  Object.entries({ x: W, y: padT - 2, "text-anchor": "end", class: "axis" }).forEach(([k, v]) => topLabel.setAttribute(k, v));
  topLabel.textContent = valueFmt(max);
  svg.append(top, topLabel);
  rows.forEach((r, i) => {
    const h = (r.value / max) * (base - padT), x = padL + i * slot, y = base - h, rad = Math.min(4, bw / 2, h);
    const path = document.createElementNS(NS, "path");
    // bar with 4px rounded top corners, square at the baseline
    path.setAttribute("d", h <= 0 ? `M${x} ${base}h${bw}` :
      `M${x} ${base}V${y + rad}Q${x} ${y} ${x + rad} ${y}H${x + bw - rad}Q${x + bw} ${y} ${x + bw} ${y + rad}V${base}Z`);
    path.setAttribute("fill", css("--series-1"));
    const hit = document.createElementNS(NS, "rect");   // hit target bigger than the mark
    Object.entries({ x: x - 1, y: padT, width: slot, height: base - padT, fill: "transparent" }).forEach(([k, v]) => hit.setAttribute(k, v));
    hit.setAttribute("tabindex", "0");
    const show = () => {
      tip.replaceChildren(el("b", { text: valueFmt(r.value) }), " · " + r.label);
      tip.style.left = ((x + bw / 2) / W * 100) + "%"; tip.style.top = (y / H * 100) + "%";
      tip.classList.remove("hidden");
    };
    hit.addEventListener("pointerenter", show); hit.addEventListener("focus", show);
    hit.addEventListener("pointerleave", () => tip.classList.add("hidden"));
    hit.addEventListener("blur", () => tip.classList.add("hidden"));
    svg.append(path, hit);
    if (i % tickEvery === 0) {
      const t = document.createElementNS(NS, "text");
      Object.entries({ x: x + bw / 2, y: H - 4, "text-anchor": "middle", class: "axis" }).forEach(([k, v]) => t.setAttribute(k, v));
      t.textContent = r.tick; svg.append(t);
    }
  });
  wrap.append(svg, tip);
  const table = el("table", {}, el("tr", {}, el("th", { text: "Month" }), el("th", { text: title })));
  for (const r of rows) table.append(el("tr", {}, el("td", { text: r.label }), el("td", { text: valueFmt(r.value) })));
  const details = el("details", {}, el("summary", { class: "muted", text: "Show as table" }), table);
  return el("div", {}, el("div", { class: "muted", text: title }), wrap, details);
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthName = (m) => MONTHS[Number(m.slice(5, 7)) - 1] + " " + m.slice(2, 4);

function renderSeason(s) {
  const box = $("season"); box.replaceChildren(el("h2", { text: "Seasonality" }));
  if (!s.listing_count) { box.append(el("div", { class: "muted", text: "No comps to chart." })); return; }
  const cal = s.forward_calendar.map((m) => ({ value: m.unavailable_share, label: monthName(m.month), tick: monthName(m.month).slice(0, 1) }));
  const rev = s.review_history.map((m) => ({ value: m.reviews_per_listing, label: monthName(m.month), tick: monthName(m.month).slice(0, 1) }));
  box.append(barChart("Reviews per comp, by month (past demand)", rev, (v) => v.toFixed(2)));
  box.append(el("div", { style: "height:10px" }));
  box.append(barChart("Nights not open, next 12 months (booked or blocked)", cal, pct));
  for (const n of s.notes) box.append(el("div", { class: "muted", style: "margin-top:6px", text: n }));
}

function renderMarket(m) {
  const box = $("market");
  const dl = el("dl", {});
  const rows = [
    ["Listings (all types)", m.total_listings], ["Entire homes", pct(m.entire_home_share)],
    ["Run by multi-listing hosts", pct(m.multi_listing_host_share)], ["Held by top 3 hosts", pct(m.top3_hosts_share)],
    ["Show a licence number", pct(m.licensed_share)], ["First reviewed in last 12 months", pct(m.new_listings_share)],
  ];
  for (const [k, v] of rows) dl.append(el("dt", { text: k }), el("dd", { text: String(v) }));
  box.replaceChildren(el("h2", { text: `Market within ${m.radius_m} m` }), dl);
}

function renderComps(a) {
  const box = $("comps");
  const table = el("table", {}, el("tr", {},
    ...["Dist.", "Bd", "Price", "Rev. 12m", "Rating", "Est. rev.", "Since"].map((h) => el("th", { text: h }))));
  for (const c of a.comps) {
    const tr = el("tr", { class: "comp", title: c.name || "" },
      el("td", { text: Math.round(c.distance_m) + " m" }), el("td", { text: c.bedrooms ?? "–" }),
      el("td", { text: eur(c.price) }), el("td", { text: c.number_of_reviews_ltm ?? "–" }),
      el("td", { text: c.review_scores_rating != null ? c.review_scores_rating.toFixed(2) : "–" }),
      el("td", { text: eur(c.est_revenue) }), el("td", { text: c.active_since ? c.active_since.slice(0, 7) : "–" }));
    tr.addEventListener("click", () => {
      const m = markersById.get(c.id);
      if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 16)); m.openPopup(); }
    });
    table.append(tr);
  }
  box.replaceChildren(el("h2", { text: `Nearest comps (${a.comps.length} of ${a.comp_stats.count})` }), table,
    el("div", { class: "muted", style: "margin-top:6px", text: "Click a row to find it on the map. “Since” = first review." }));
}

loadMeta();
