<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stragent · Thessaloniki STR analyst</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="layout">
  <aside>
    <h1>Should I Airbnb this flat?</h1>
    <p class="sub">Thessaloniki · Inside Airbnb data · estimates, not bookings</p>

    <form id="f">
      <label>Address or "lat, lon" (or click the map)
        <input id="address" required placeholder="Egnatia 120" autocomplete="off">
      </label>
      <div class="row">
        <label>Bedrooms
          <select id="bedrooms">
            <option value="">Any</option><option>0</option><option>1</option>
            <option selected>2</option><option>3</option><option>4</option><option>5</option>
          </select>
        </label>
        <label>Snapshot
          <select id="snapshot"><option value="">Latest</option></select>
        </label>
      </div>
      <label>Search radius: <output id="radius_out">Auto</output>
        <input id="radius" type="range" min="0" max="3000" step="100" value="0"
               aria-describedby="radius_help">
      </label>
      <div id="radius_help" class="muted">Auto starts at 500 m and widens until there are 10 comps.
        Slide right to fix the radius; click the map to move the point.</div>
      <details class="filters">
        <summary>Comp filters</summary>
        <div class="row">
          <label>Min reviews (12 m)<input id="min_reviews" type="number" min="0" value="0"></label>
          <label>Min rating<input id="min_rating" type="number" min="0" max="5" step="0.1" placeholder="any"></label>
        </div>
        <div class="row">
          <label>Max minimum stay<input id="max_min_nights" type="number" min="1" placeholder="any"></label>
          <label>Comps to list<input id="show" type="number" min="1" max="200" value="15"></label>
        </div>
        <label class="check"><input id="superhost_only" type="checkbox"> Superhosts only</label>
      </details>
      <button id="go" type="submit">Analyse</button>
    </form>
    <div id="err" class="error hidden" role="alert"></div>
    <div id="results" class="hidden">
      <div class="card" id="summary"></div>
      <div class="card" id="season"></div>
      <div class="card" id="market"></div>
      <div class="card" id="comps"></div>
    </div>
    <p class="muted credit">Data: <a href="https://insideairbnb.com">Inside Airbnb</a>, CC BY 4.0 ·
      <a href="/docs">API docs</a></p>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
